[project]
name = "mychatpdf-backend"
version = "0.1.0"
description = "FastAPI backend for the MyPDFChat Phase 1 MVP"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "boto3>=1.34.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "pinecone>=5.0.0",
    "psycopg[binary]>=3.1.18",
    "pydantic-settings>=2.2.1",
    "pymupdf>=1.24.0",
    "pyjwt[crypto]>=2.8.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0.0",
    "striprtf>=0.0.26",
    "redis>=5.0.0",
    "rq>=1.16.0",
    "sqlalchemy>=2.0.29",
    "sentry-sdk>=2.0.0",
    "stripe>=10.0.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
