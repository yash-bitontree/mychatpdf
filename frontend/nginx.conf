server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    location ^~ /app/assets/ {
        rewrite ^/app/(.*)$ /$1 break;
        try_files $uri =404;
        # Alpine Nginx does not map .mjs by default. PDF.js loads its worker as
        # an ES module, which browsers reject when served as octet-stream.
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /app {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
