services:
  frontend:
    build:
      target: production
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.mypdfchat.com}
    ports: !override
      - "127.0.0.1:5173:5173"
    volumes: !reset []
    restart: unless-stopped
